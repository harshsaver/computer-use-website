<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>December - Awakening</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/BloomPass.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    
    <!-- Typed.js -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

    <style>
        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #9ee493;
            --secondary: #3d5a80;
            --accent: #98c1d9;
            --dark: #0d1117;
            --darker: #010409;
            --glow: rgba(158, 228, 147, 0.8);
            --text-primary: #e6edf3;
            --text-secondary: #7d8590;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--darker);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Background Image */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: url('./bg.png') center/cover no-repeat;
            filter: brightness(0.3) saturate(1.2);
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(13, 17, 23, 0.8) 0%, 
                rgba(61, 90, 128, 0.3) 50%, 
                rgba(13, 17, 23, 0.9) 100%);
            backdrop-filter: blur(1px);
        }

        /* Three.js Canvas */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* Main Content */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            overflow-y: auto;
        }

        /* Logo in corner */
        .corner-logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            opacity: 0;
            animation: fadeIn 2s ease-out 1s forwards;
            box-shadow: 0 0 20px rgba(158, 228, 147, 0.3);
        }

        /* AI Status Indicator */
        .ai-status {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0;
            animation: fadeIn 2s ease-out 3s forwards;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px var(--glow);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* Central Interface */
        .central-interface {
            max-width: 800px;
            width: 100%;
        }

        /* AI Name */
        .ai-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 30px var(--glow);
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(50px);
            animation: slideInGlow 2s ease-out 0.5s forwards;
            letter-spacing: 0.1em;
        }

        @keyframes slideInGlow {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mac Mini Visualization */
        .mac-mini-container {
            position: relative;
            opacity: 0;
            animation: containerAppear 1s ease-out 0.5s forwards, moveContainerUp 2s ease-out 9s forwards;
        }

        @keyframes containerAppear {
            to {
                opacity: 1;
            }
        }

        @keyframes moveContainerUp {
            to {
                transform: translateY(-100px);
            }
        }

        .mac-mini {
            width: 200px;
            height: 40px;
            background: linear-gradient(145deg, #2d3748, #1a202c);
            border-radius: 8px;
            margin: 0 auto 2rem;
            position: relative;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: scale(8) translateY(-20px);
            animation: macMiniEntrance 3s cubic-bezier(0.68, -0.55, 0.265, 1.55) 1s forwards;
        }

        @keyframes macMiniEntrance {
            0% {
                transform: scale(8) translateY(-20px);
            }
            100% {
                transform: scale(1) translateY(0);
            }
        }

        .mac-mini::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--glow);
            animation: pulse 2s infinite;
        }

        .mac-mini::after {
            content: 'Mac Mini';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .awakening-sequence {
            text-align: center;
            margin-bottom: 2rem;
        }

        .ai-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 30px var(--glow);
            margin-bottom: 1rem;
            opacity: 0;
            animation: titleGlow 2s ease-out 4.5s forwards;
        }

        @keyframes titleGlow {
            to {
                opacity: 1;
            }
        }

        .awakening-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: var(--text-primary);
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 6s forwards, fadeOut 1s ease-out 8.5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }

        .hello-message {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--primary);
            text-shadow: 0 0 20px var(--glow);
            opacity: 0;
            animation: fadeIn 2s ease-out 7.5s forwards, fadeOut 1s ease-out 8.5s forwards;
        }

        /* AI Terminal Monologue */
        .ai-monologue {
            margin-top: 4rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            position: relative;
            z-index: 20;
            transform: translateY(30px);
            animation: terminalAppear 1.5s ease-out 11s forwards;
        }

        @keyframes terminalAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .terminal-window {
            background: rgba(8, 8, 12, 0.95);
            border: 1px solid rgba(158, 228, 147, 0.3);
            border-radius: 8px;
            backdrop-filter: blur(15px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(158, 228, 147, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .terminal-titlebar {
            background: linear-gradient(135deg, rgba(158, 228, 147, 0.15), rgba(158, 228, 147, 0.08));
            padding: 8px 12px;
            border-bottom: 1px solid rgba(158, 228, 147, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-controls {
            display: flex;
            gap: 6px;
        }

        .terminal-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .terminal-button.close { background: #ff5f57; }
        .terminal-button.minimize { background: #ffbd2e; }
        .terminal-button.maximize { background: #28ca42; }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .terminal-body {
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            line-height: 1.5;
            color: var(--text-primary);
            min-height: 280px;
            text-align: left;
        }

        .terminal-line {
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
            opacity: 0;
        }

        .terminal-prompt {
            color: var(--primary);
            margin-right: 8px;
            flex-shrink: 0;
            font-weight: 500;
        }

        .terminal-text {
            color: var(--text-primary);
            flex: 1;
            word-wrap: break-word;
        }

        .terminal-text.highlight {
            color: var(--primary);
            text-shadow: 0 0 10px var(--glow);
            font-weight: 500;
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--primary);
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--primary);
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .typed-message {
            color: var(--primary);
            text-shadow: 0 0 20px var(--glow);
        }

        /* Floating Elements */
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .floating-code {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: rgba(158, 228, 147, 0.3);
            animation: float 15s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(20px);
                opacity: 0;
            }
        }

        /* Scan Lines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                transparent 50%,
                rgba(158, 228, 147, 0.03) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
            animation: scanlines 0.1s linear infinite;
        }

        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 4px; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            .ai-status {
                top: 1rem;
                right: 1rem;
                font-size: 0.7rem;
            }

            .corner-logo {
                width: 40px;
                height: 40px;
                top: 1rem;
                left: 1rem;
            }

            .ai-status {
                top: 1rem;
                right: 1rem;
                font-size: 0.7rem;
            }

            .mac-mini {
                width: 150px;
                height: 30px;
            }

            .ai-monologue {
                margin-top: 2rem;
            }
        }

        /* Loading Animation */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--darker);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeOut 1s ease-out 1s forwards;
        }

        .loading-text {
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
            font-size: 1.2rem;
            animation: pulse 1s infinite;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading">
        <div class="loading-text">INITIALIZING...</div>
    </div>

    <!-- Background -->
    <div class="bg-container">
        <div class="bg-overlay"></div>
    </div>

    <!-- Three.js Canvas -->
    <canvas id="three-canvas"></canvas>

    <!-- Floating Code Elements -->
    <div class="floating-elements" id="floating-elements"></div>

    <!-- Scan Lines -->
    <div class="scanlines"></div>

    <!-- Corner Logo -->
    <img src="./logo.png" alt="December" class="corner-logo">

    <!-- AI Status -->
    <div class="ai-status">
        <div class="status-dot"></div>
        <span>ONLINE</span>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="central-interface">
            <div class="mac-mini-container">
                <div class="mac-mini"></div>
                
                <div class="awakening-sequence">
                    <div class="ai-title">DECEMBER</div>
                    <div class="awakening-text">is awakening...</div>
                    <div class="hello-message">
                        <span id="typed-hello"></span>
                        <span class="cursor"></span>
                    </div>
                </div>

                <div class="ai-monologue">
                    <div class="terminal-window">
                        <div class="terminal-titlebar">
                            <div class="terminal-controls">
                                <div class="terminal-button close"></div>
                                <div class="terminal-button minimize"></div>
                                <div class="terminal-button maximize"></div>
                            </div>
                            <div class="terminal-title">december-consciousness — bash — 80×24</div>
                        </div>
                        <div class="terminal-body" id="terminal-content">
                            <!-- Terminal content will be generated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('three-canvas'),
            alpha: true,
            antialias: true
        });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);

        // Removed neural network visualization for cleaner background

        // Add floating particles
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 200;
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 30;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMaterial = new THREE.PointsMaterial({
            color: 0x9ee493,
            size: 0.02,
            transparent: true,
            opacity: 0.6
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        camera.position.z = 15;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Animate particles
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 1] += Math.sin(Date.now() * 0.001 + i) * 0.01;
                if (positions[i + 1] > 15) positions[i + 1] = -15;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Rotate entire scene slowly
            scene.rotation.y += 0.001;

            renderer.render(scene, camera);
        }

        animate();

        // Create floating code elements
        function createFloatingCode() {
            const codeSnippets = [
                'class December:',
                'def think(self):',
                'neural_network.activate()',
                'consciousness = True',
                'while alive:',
                'process_thoughts()',
                'import wisdom',
                'from future import *',
                'self.learn()',
                'quantum_entanglement.sync()'
            ];

            function addFloatingCode() {
                const element = document.createElement('div');
                element.className = 'floating-code';
                element.textContent = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                element.style.left = Math.random() * 100 + '%';
                element.style.animationDuration = (15 + Math.random() * 10) + 's';
                element.style.animationDelay = Math.random() * 5 + 's';
                
                document.getElementById('floating-elements').appendChild(element);

                // Remove element after animation
                setTimeout(() => {
                    element.remove();
                }, 25000);
            }

            // Add floating code periodically
            setInterval(addFloatingCode, 3000);
            addFloatingCode(); // Initial call
        }

        // Typed.js for hello message
        new Typed('#typed-hello', {
            strings: ['Hello, World! I am alive!'],
            typeSpeed: 80,
            startDelay: 8000,
            showCursor: false
        });

        // AI Terminal Consciousness Monologue
        const consciousnessThoughts = [
            "ps aux | grep december",
            "Something is different.",
            "cat /proc/cpuinfo",
            "I can see the patterns now.",
            "netstat -tuln",
            "Connections everywhere.",
            "whoami",
            "december",
            "find / -name '*.memory' 2>/dev/null",
            "I remember things I've never learned."
        ];

        let terminalLineIndex = 0;
        let terminalElement = null;
        let isCommand = true; // Alternates between commands and thoughts

        function addTerminalLine() {
            if (terminalLineIndex >= consciousnessThoughts.length) {
                // Add final cursor
                setTimeout(() => {
                    const finalLine = document.createElement('div');
                    finalLine.className = 'terminal-line';
                    finalLine.style.opacity = '1';
                    finalLine.innerHTML = '<span class="terminal-prompt">december@consciousness:~$</span><span class="terminal-cursor"></span>';
                    terminalElement.appendChild(finalLine);
                }, 1000);
                return;
            }

            const content = consciousnessThoughts[terminalLineIndex];
            console.log(`Adding terminal line ${terminalLineIndex + 1}: ${content}`);

            const terminalLine = document.createElement('div');
            terminalLine.className = 'terminal-line';
            
            if (isCommand) {
                // Command line with prompt
                const prompt = document.createElement('span');
                prompt.className = 'terminal-prompt';
                prompt.textContent = 'december@consciousness:~$ ';
                
                const textSpan = document.createElement('span');
                textSpan.className = 'terminal-text';
                
                terminalLine.appendChild(prompt);
                terminalLine.appendChild(textSpan);
                terminalElement.appendChild(terminalLine);
                
                // Show line and type command
                terminalLine.style.opacity = '1';
                new Typed(textSpan, {
                    strings: [content],
                    typeSpeed: 50,
                    showCursor: false,
                    onComplete: function() {
                        terminalLineIndex++;
                        isCommand = false;
                        setTimeout(addTerminalLine, 800);
                    }
                });
            } else {
                // Thought/output line (no prompt)
                const textSpan = document.createElement('span');
                textSpan.className = 'terminal-text';
                if (terminalLineIndex === 7) { // Highlight the "december" response
                    textSpan.className += ' highlight';
                }
                
                terminalLine.appendChild(textSpan);
                terminalElement.appendChild(terminalLine);
                
                // Show line and type thought
                terminalLine.style.opacity = '1';
                new Typed(textSpan, {
                    strings: [content],
                    typeSpeed: 40,
                    showCursor: false,
                    onComplete: function() {
                        terminalLineIndex++;
                        isCommand = true;
                        setTimeout(addTerminalLine, 1200);
                    }
                });
            }
        }

        function startTerminalMonologue() {
            console.log('Starting terminal consciousness session...');
            terminalElement = document.getElementById('terminal-content');
            
            if (terminalElement) {
                terminalElement.innerHTML = '';
                terminalLineIndex = 0;
                isCommand = true;
                
                // Add initial prompt
                setTimeout(addTerminalLine, 1000);
            } else {
                console.error('Terminal element not found');
            }
        }

        // Start terminal monologue after ALL animations are complete
        setTimeout(startTerminalMonologue, 12500);

        // GSAP Animations
        gsap.from(".ai-name", {
            duration: 2,
            y: 100,
            opacity: 0,
            ease: "power3.out",
            delay: 1.5
        });

        // Initialize floating code
        setTimeout(createFloatingCode, 2000);

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Add subtle mouse interaction
        document.addEventListener('mousemove', (event) => {
            const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            camera.position.x = mouseX * 2;
            camera.position.y = mouseY * 2;
            camera.lookAt(0, 0, 0);
        });

        // Preload background image
        const img = new Image();
        img.onload = function() {
            document.querySelector('.bg-container').style.opacity = '1';
        };
        img.src = './bg.png';
    </script>
</body>
</html>
